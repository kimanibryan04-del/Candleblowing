<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a Wish, Little Panda! 🐼🎂</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ffeef8 0%, #fecfef 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #4a4a4a;
      overflow: hidden;
      position: relative;
    }

    /* FLOATING HEARTS BACKGROUND */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .container {
      background: rgba(255, 255, 255, 0.93);
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(232, 67, 147, 0.15);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(5px);
    }
    h1 { color: #d63031; font-size: 1.8rem; margin-bottom: 8px; }
    p.subtitle { color: #636e72; font-size: 0.95rem; margin-bottom: 25px; }

    /* CAKE & CANDLE CONTAINER */
    .cake-container {
      position: relative;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 25px;
    }

    /* FLAME */
    .flame {
      width: 22px;
      height: 32px;
      background: radial-gradient(ellipse at bottom, #ffeaa7 0%, #fdcb6e 40%, #e17055 80%, transparent 100%);
      border-radius: 50% 50% 35% 35%;
      margin-bottom: 4px;
      box-shadow: 0 0 20px #fdcb6e;
      animation: flicker 0.15s infinite alternate;
      transition: opacity 0.2s ease;
    }

    /* SMOKE */
    .smoke {
      display: none;
      width: 10px;
      height: 25px;
      background: rgba(180, 180, 180, 0.6);
      border-radius: 10px;
      margin-bottom: 4px;
      animation: rise 1.5s ease-out infinite;
    }

    /* CANDLE STICK */
    .candle {
      width: 14px;
      height: 55px;
      background: linear-gradient(to right, #e84393, #fd79a8, #e84393);
      border-radius: 4px 4px 0 0;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
    }

    /* CAKE LAYERS */
    .cake {
      width: 180px;
      height: 90px;
      background: #fd79a8;
      border-radius: 12px 12px 0 0;
      position: relative;
      box-shadow: 0 8px 0 #e84393, inset 0 12px 0 #ffeef8;
    }
    .frosting {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 20px;
      background: #ffeef8;
      border-radius: 12px 12px 10px 10px;
    }

    /* BUTTONS & MESSAGES */
    .btn {
      background: #e84393;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(232, 67, 147, 0.3);
      transition: transform 0.1s ease, background 0.2s ease;
      margin-top: 10px;
    }
    .btn:active { transform: scale(0.96); }

    .wish-card {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff0f6;
      border-radius: 16px;
      border: 2px dashed #ff85c0;
      animation: fadeIn 0.5s ease;
    }
    .wish-card h2 { color: #d63031; font-size: 1.2rem; margin-bottom: 5px; }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-1deg); }
      100% { transform: scale(1.08) rotate(1deg); }
    }
    @keyframes rise {
      0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
      100% { transform: translateY(-30px) scaleX(2); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Container -->
  <div class="bg-hearts" id="heartsContainer"></div>

  <div class="container">
    <h1>Make a Wish, Darling ! 🎂</h1>
    <p class="subtitle">Close your eyes, make a wish, and blow into your mic or tap the button!</p>

    <div class="cake-container">
      <div id="flame" class="flame"></div>
      <div id="smoke" class="smoke"></div>
      <div class="candle"></div>
      <div class="cake">
        <div class="frosting"></div>
      </div>
    </div>

    <button id="blowBtn" class="btn" onclick="extinguishCandle()">Blow Out Candle 💨</button>
    <button id="relightBtn" class="btn" style="display:none; background:#0984e3;" onclick="relightCandle()">Relight Candle 🕯️</button>

    <div id="wishCard" class="wish-card">
      <h2>Wish Granted! 💫</h2>
      <p>Your birthday wish is locked in, My Love 🤍! May all your dreams come true! ✨</p>
    </div>
  </div>

  <script>
    // Create floating background hearts
    const heartsContainer = document.getElementById('heartsContainer');
    const heartEmojis = ['💖', '🤍', '🌸', '✨', '💕', '💗'];

    for (let i = 0; i < 20; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      heart.style.fontSize = (16 + Math.random() * 16) + 'px';
      heartsContainer.appendChild(heart);
    }

    let isBlown = false;
    let micCooldown = false;

    function extinguishCandle() {
      if (isBlown) return;
      isBlown = true;

      document.getElementById('flame').style.display = 'none';
      document.getElementById('smoke').style.display = 'block';

      document.getElementById('wishCard').style.display = 'block';
      document.getElementById('blowBtn').style.display = 'none';
      document.getElementById('relightBtn').style.display = 'inline-block';

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    function relightCandle() {
      isBlown = false;
      micCooldown = true; // Temporary cooldown so click noise doesn't trigger it

      document.getElementById('flame').style.display = 'block';
      document.getElementById('smoke').style.display = 'none';
      document.getElementById('wishCard').style.display = 'none';
      document.getElementById('blowBtn').style.display = 'inline-block';
      document.getElementById('relightBtn').style.display = 'none';

      // Re-enable microphone listening after 1.5 seconds
      setTimeout(() => {
        micCooldown = false;
      }, 1500);
    }

    // Continuous Microphone blow detection
    async function initMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const mic = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        mic.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function checkBlow() {
          if (!isBlown && !micCooldown) {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let average = sum / dataArray.length;
            if (average > 35) {
              extinguishCandle();
            }
          }
          requestAnimationFrame(checkBlow);
        }
        checkBlow();
      } catch (err) {
        // Fallback to button if mic permission is denied
      }
    }

    window.addEventListener('load', initMic);
  </script>
</body>
</html>
